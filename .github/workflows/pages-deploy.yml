name: "Build and Deploy"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Configure GitHub Pages
      # --------------------------------------------------
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # --------------------------------------------------
      # Setup Ruby
      # --------------------------------------------------
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # --------------------------------------------------
      # Build Jekyll site
      # --------------------------------------------------
      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # --------------------------------------------------
      # Inspect generated HTML
      # --------------------------------------------------
      - name: Inspect generated links
        run: |
          echo "=== Empty href ==="
          grep -RIn 'href=""' _site | head -100 || true

          echo "=== Anchor tags ==="
          grep -RIn '<a[^>]*>' _site | head -100 || true

      # --------------------------------------------------
      # Test generated site
      # --------------------------------------------------
      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      # --------------------------------------------------
      # Upload GitHub Pages artifact
      # --------------------------------------------------
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  # ======================================================
  # Deploy
  # ======================================================

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5